<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple 2D Vanilla JS Scroller</title>
    <style>
        body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { background: #22a6b3; border: 4px solid #fff; }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="400"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game State
let bgX = 0;
const speed = 2;

const player = {
    x: 100,
    y: 300,
    width: 40,
    height: 40,
    color: '#ffbe76'
};

// Main Game Loop
function update() {
    // 1. Update positions
    bgX -= speed;
    if (bgX <= -canvas.width) bgX = 0; // Reset background to loop cleanly

    // 2. Clear previous frame
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 3. Draw Scrolling Background (Simulated via vertical lines here)
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 5;
    for (let i = 0; i < 2; i++) {
        let currentBgX = bgX + (i * canvas.width);
        // Draw decorative background pillars/lines
        for (let x = 0; x < canvas.width; x += 100) {
            ctx.beginPath();
            ctx.moveTo(currentBgX + x, 0);
            ctx.lineTo(currentBgX + x, canvas.height);
            ctx.stroke();
        }
    }

    // 4. Draw Player
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.width, player.height);

    // 5. Recall the loop
    requestAnimationFrame(update);
}

// Start game after window loads
window.addEventListener('load', () => {
    update();
});
</script>
</body>
</html>
